<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="headGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#DD8800"/>
    </radialGradient>
    <radialGradient id="earDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DD8800"/>
      <stop offset="100%" stop-color="#CC7700"/>
    </radialGradient>
  </defs>

  <!-- Ears -->
  <path d="M 48 62 Q 30 15 68 42 Q 56 50 48 62 Z" fill="url(#earDark)" stroke="#2C1810" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 152 62 Q 170 15 132 42 Q 144 50 152 62 Z" fill="url(#earDark)" stroke="#2C1810" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 52 56 Q 38 24 64 44" fill="none" stroke="#FFB6C1" stroke-width="4" stroke-linecap="round"/>
  <path d="M 148 56 Q 162 24 136 44" fill="none" stroke="#FFB6C1" stroke-width="4" stroke-linecap="round"/>

  <!-- Head shape -->
  <path d="M 100 28 
           C 135 28 155 45 165 68 
           C 172 86 172 108 165 128 
           C 155 152 135 170 100 175 
           C 65 170 45 152 35 128 
           C 28 108 28 86 35 68 
           C 45 45 65 28 100 28 Z" 
        fill="url(#headGrad)" stroke="#2C1810" stroke-width="3"/>

  <!-- Forehead / brow ridge -->
  <path d="M 55 68 Q 100 58 145 68" fill="none" stroke="#2C1810" stroke-width="1.5" opacity="0.3"/>

  <!-- Forehead stripes (王 pattern) -->
  <path d="M 60 60 L 140 60" stroke="#2C1810" stroke-width="4" stroke-linecap="round"/>
  <path d="M 55 74 L 145 74" stroke="#2C1810" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 100 48 L 100 82" stroke="#2C1810" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Side stripes -->
  <path d="M 40 88 L 52 92" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/>
  <path d="M 36 100 L 50 100" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 112 L 52 108" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/>

  <path d="M 160 88 L 148 92" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/>
  <path d="M 164 100 L 150 100" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/>
  <path d="M 160 112 L 148 108" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/>

  <!-- White muzzle area -->
  <path d="M 55 128 Q 100 155 145 128 C 150 148 130 168 100 172 C 70 168 50 148 55 128 Z" fill="#FFF8F0" stroke="#2C1810" stroke-width="2"/>

  <!-- Chin -->
  <path d="M 100 155 L 100 168" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  
  
  <circle cx="70" cy="98" r="8" fill="#2C1810"/>
  <circle cx="130" cy="98" r="8" fill="#2C1810"/>

  <!-- Eye outlines / eyelids -->
  <path d="M 55 97 Q 70 87 85 97" fill="none" stroke="#2C1810" stroke-width="2.5"/>
  <path d="M 115 97 Q 130 87 145 97" fill="none" stroke="#2C1810" stroke-width="2.5"/>

  <!-- Nose -->
  <path d="M 90 118 L 110 118 L 100 128 Z" fill="#2C1810"/>
  <path d="M 90 118 L 100 122" stroke="#2C1810" stroke-width="1.5"/>
  <path d="M 110 118 L 100 122" stroke="#2C1810" stroke-width="1.5"/>

  <!-- Nose bridge highlight -->
  <path d="M 97 128 L 98 135" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Mouth -->
  <path d="M 100 128 Q 82 140 68 131" fill="none" stroke="#2C1810" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 100 128 Q 118 140 132 131" fill="none" stroke="#2C1810" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Whisker dots -->
  <circle cx="56" cy="118" r="2" fill="#2C1810"/>
  <circle cx="50" cy="126" r="2" fill="#2C1810"/>
  <circle cx="54" cy="134" r="2" fill="#2C1810"/>
  <circle cx="144" cy="118" r="2" fill="#2C1810"/>
  <circle cx="150" cy="126" r="2" fill="#2C1810"/>
  <circle cx="146" cy="134" r="2" fill="#2C1810"/>

  <!-- Whisker lines -->
  <line x1="44" y1="122" x2="18" y2="118" stroke="#2C1810" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="42" y1="130" x2="14" y2="132" stroke="#2C1810" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="44" y1="138" x2="18" y2="144" stroke="#2C1810" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="156" y1="122" x2="182" y2="118" stroke="#2C1810" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="158" y1="130" x2="186" y2="132" stroke="#2C1810" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="156" y1="138" x2="182" y2="144" stroke="#2C1810" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>
