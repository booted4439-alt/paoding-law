{% extends "base.html" %}
{% block title %}登录 — 庖丁法律服务{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>登录</h2>

    <!-- 登录方式切换 -->
    <div class="login-tabs">
        <span class="login-tab {{ 'active' if login_mode != 'sms' }}" onclick="switchTab('password')">密码登录</span>
        <span class="login-tab {{ 'active' if login_mode == 'sms' }}" onclick="switchTab('sms')">验证码登录</span>
    </div>

    <!-- 密码登录 -->
    <form method="post" id="form-password" style="display: {{ 'none' if login_mode == 'sms' else 'block' }}">
        <input type="hidden" name="login_mode" value="password">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" name="phone" required pattern="1\d{10}" placeholder="11位手机号" maxlength="11">
        </div>
        <div class="form-group">
            <label>密码</label>
            <div class="pwd-field">
                <input type="password" name="password" id="login-pwd" required>
                <button type="button" class="pwd-toggle" onclick="togglePwd('login-pwd', this)">显示</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <!-- 验证码登录 -->
    <form method="post" id="form-sms" style="display: {{ 'block' if login_mode == 'sms' else 'none' }}">
        <input type="hidden" name="login_mode" value="sms">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" name="phone" required pattern="1\d{10}" placeholder="11位手机号" maxlength="11" id="sms-phone">
        </div>
        <div class="form-group">
            <label>验证码</label>
            <div class="input-row">
                <input type="text" name="sms_code" required maxlength="6" placeholder="6位验证码" style="flex:1;">
                <button type="button" class="code-btn" id="send-code-btn" onclick="sendSmsCode()">获取验证码</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <p class="auth-link">没有账号？<a href="/auth/register">立即注册</a></p>
</div>

<style>
.login-tabs { display:flex; margin-bottom:20px; border-bottom:2px solid #eee; }
.login-tab { flex:1; text-align:center; padding:10px 0; cursor:pointer; color:#999; font-size:15px; }
.login-tab.active { color:#333; font-weight:600; border-bottom:2px solid #07c160; margin-bottom:-2px; }
.input-row { display:flex; gap:8px; }
.code-btn { padding:8px 16px; background:#07c160; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; white-space:nowrap; }
.code-btn:active { opacity:0.8; }
.code-btn:disabled { background:#ccc; cursor:not-allowed; }
.divider-row { display:flex; align-items:center; margin:20px 0; }
.divider-line { flex:1; height:1px; background:#eee; }
.divider-text { padding:0 12px; color:#ccc; font-size:13px; }
.btn-wechat { background:#07c160; color:#fff; text-align:center; display:block; padding:12px; border-radius:8px; text-decoration:none; font-size:15px; }
.btn-wechat:hover { opacity:0.9; }
</style>

<script>
let codeCountdown = 0
let codeTimer = null

function switchTab(mode) {
    document.querySelectorAll('.login-tab').forEach((el,i) => {
        el.classList.toggle('active', (i===0 && mode==='password') || (i===1 && mode==='sms'))
    })
    document.getElementById('form-password').style.display = mode === 'password' ? 'block' : 'none'
    document.getElementById('form-sms').style.display = mode === 'sms' ? 'block' : 'none'
}

function sendSmsCode() {
    if (codeCountdown > 0) return
    const phone = document.getElementById('sms-phone').value
    if (!/^1\d{10}$/.test(phone)) { alert('请输入正确的手机号码'); return }
    const btn = document.getElementById('send-code-btn')
    btn.disabled = true
    fetch('/api/sms/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone})
    }).then(r => r.json()).then(data => {
        if (data.success) {
            alert(data.message || '验证码已发送')
            codeCountdown = 60
            btn.textContent = '60s'
            codeTimer = setInterval(() => {
                codeCountdown--
                if (codeCountdown <= 0) {
                    clearInterval(codeTimer)
                    btn.textContent = '重新获取'
                    btn.disabled = false
                } else {
                    btn.textContent = codeCountdown + 's'
                }
            }, 1000)
        } else {
            alert(data.message || '发送失败')
            btn.disabled = false
        }
    }).catch(() => {
        alert('网络异常')
        btn.disabled = false
    })
}
</script>
{% endblock %}
