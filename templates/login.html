{% extends "base.html" %}
{% block title %}登录 — 庖丁法律服务{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>登录</h2>
    <form method="post">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" name="phone" required pattern="1\d{10}" placeholder="11位手机号" maxlength="11">
        </div>
        <div class="form-group">
            <label>密码</label>
            <div class="pwd-field">
                <input type="password" name="password" id="login-pwd" required>
                <button type="button" class="pwd-toggle" onclick="togglePwd('login-pwd', this)">👁</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <p class="auth-link">没有账号？<a href="/auth/register">立即注册</a></p>
</div>
{% endblock %}
