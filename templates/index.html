{% extends "base.html" %}
{% block title %}庖丁法律服务 — 专业法律咨询{% endblock %}
{% block content %}
<section class="hero">
    <div class="hero-content">
        <div class="hero-badge">智能法律服务平台</div>
        <h1 class="hero-title">
            让法律服务<br>
            <span class="gradient-text">更简单、更高效</span>
        </h1>
        <p class="hero-desc">
            庖丁法律服务，为您提供专业的在线法律咨询、文书撰写与审核服务。
            资深律师团队，7×24小时在线响应。
        </p>
        <div class="hero-actions">
            <a href="/consult" class="btn btn-primary btn-lg">
                <span>开始免费咨询</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a href="/documents" class="btn btn-outline btn-lg">浏览法律文档</a>
        </div>
    </div>
</section>



<section class="stats">
    <div class="stats-inner">
        <div class="stat">
            <span class="stat-num">500+</span>
            <span class="stat-label">服务客户</span>
        </div>
        <div class="stat">
            <span class="stat-num">98%</span>
            <span class="stat-label">满意度</span>
        </div>
        <div class="stat">
            <span class="stat-num">50+</span>
            <span class="stat-label">专业律师</span>
        </div>
        <div class="stat">
            <span class="stat-num">7×24</span>
            <span class="stat-label">在线服务</span>
        </div>
    </div>
</section>
{% endblock %}
