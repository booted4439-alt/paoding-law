{% extends "base.html" %}
{% block title %}注册 — 庖丁法律服务{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>注册</h2>
    <form method="post" onsubmit="return validateForm(event)">
        <div class="form-group">
            <input type="text" name="username" required placeholder="用户名">
        </div>
        <div class="form-group">
            <input type="email" name="email" placeholder="邮箱(选填,律师回复时可以收到邮件通知)">
        </div>
        <div class="form-group">
            <div class="pwd-field">
                <input type="password" name="password" id="reg-pwd" required minlength="6" placeholder="密码(至少6位,只能包含字母和数字)">
                <button type="button" class="pwd-toggle" onclick="togglePwd('reg-pwd', this)" aria-label="切换密码可见性">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.0146 8.3086C11.7816 13.697 4.21836 13.697 0.98532 8.3086C0.871428 8.11866 0.871431 7.88135 0.98532 7.69141C4.21836 2.30301 11.7816 2.303 15.0146 7.69141C15.1285 7.88135 15.1285 8.11866 15.0146 8.3086ZM2.21091 8C5.00794 12.1994 10.9932 12.1997 13.79 8C10.9932 3.80031 5.00794 3.80061 2.21091 8Z" fill="currentColor"/><path d="M9.40036 8C9.40036 7.2268 8.77317 6.59961 7.99997 6.59961C7.22677 6.59961 6.59958 7.2268 6.59958 8C6.59958 8.7732 7.22677 9.40039 7.99997 9.40039C8.77317 9.40039 9.40036 8.7732 9.40036 8ZM10.5996 8C10.5996 9.43594 9.43591 10.5996 7.99997 10.5996C6.56403 10.5996 5.40036 9.43594 5.40036 8C5.40036 6.56406 6.56403 5.40039 7.99997 5.40039C9.43591 5.40039 10.5996 6.56406 10.5996 8Z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
        <div class="form-group">
            <div class="pwd-field">
                <input type="password" name="confirm_password" id="reg-confirm-pwd" required minlength="6" placeholder="确认密码">
                <button type="button" class="pwd-toggle" onclick="togglePwd('reg-confirm-pwd', this)" aria-label="切换密码可见性">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.0146 8.3086C11.7816 13.697 4.21836 13.697 0.98532 8.3086C0.871428 8.11866 0.871431 7.88135 0.98532 7.69141C4.21836 2.30301 11.7816 2.303 15.0146 7.69141C15.1285 7.88135 15.1285 8.11866 15.0146 8.3086ZM2.21091 8C5.00794 12.1994 10.9932 12.1997 13.79 8C10.9932 3.80031 5.00794 3.80061 2.21091 8Z" fill="currentColor"/><path d="M9.40036 8C9.40036 7.2268 8.77317 6.59961 7.99997 6.59961C7.22677 6.59961 6.59958 7.2268 6.59958 8C6.59958 8.7732 7.22677 9.40039 7.99997 9.40039C8.77317 9.40039 9.40036 8.7732 9.40036 8ZM10.5996 8C10.5996 9.43594 9.43591 10.5996 7.99997 10.5996C6.56403 10.5996 5.40036 9.43594 5.40036 8C5.40036 6.56406 6.56403 5.40039 7.99997 5.40039C9.43591 5.40039 10.5996 6.56406 10.5996 8Z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
        <div class="form-group">
            <input type="tel" name="phone" id="reg-phone" required pattern="1\d{10}" placeholder="手机号码（11位）" maxlength="11">
        </div>
        <div class="form-group">
            <div class="sms-row">
                <input type="text" name="sms_code" id="reg-sms-code" required placeholder="速通互联验证码" maxlength="6" pattern="\d{4,6}">
                <button type="button" class="btn btn-sm btn-outline" id="send-sms-btn" onclick="sendSmsCode()">获取验证码</button>
            </div>
        </div>
        <p class="agreement-text">注册即代表已阅读并同意我们的 <a href="/terms" target="_blank">用户协议</a> 与 <a href="/privacy" target="_blank">隐私政策</a></p>
        <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>
    <p class="auth-link">已有账号？<a href="/auth/login">立即登录</a></p>
</div>

<style>
.agreement-text { text-align: center; font-size: 13px; color: var(--text-muted, #999); margin-bottom: 16px; }
.agreement-text a { color: var(--primary, #07c160); text-decoration: none; }
.agreement-text a:hover { text-decoration: underline; }
.sms-row { display: flex; gap: 8px; }
.sms-row input { flex: 1; }
.sms-row button { flex-shrink: 0; white-space: nowrap; }
#send-sms-btn:disabled { opacity: 0.5; cursor: not-allowed; }
/* Flash errors are handled by base.html */
</style>

<script>
let smsTimer = 0;
let smsCountdown = 0;

function sendSmsCode() {
    const phone = document.getElementById('reg-phone').value.trim();
    if (!/^1\d{10}$/.test(phone)) {
        alert('请输入正确的11位手机号');
        return;
    }

    const btn = document.getElementById('send-sms-btn');
    btn.disabled = true;
    btn.textContent = '发送中...';

    fetch('/api/sms/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert('验证码已发送，请查收短信');
            startCountdown(60);
        } else {
            alert(data.message || '发送失败，请稍后重试');
            btn.disabled = false;
            btn.textContent = '获取验证码';
        }
    })
    .catch(() => {
        alert('网络错误，请重试');
        btn.disabled = false;
        btn.textContent = '获取验证码';
    });
}

function startCountdown(seconds) {
    const btn = document.getElementById('send-sms-btn');
    smsCountdown = seconds;
    btn.textContent = smsCountdown + 's';
    clearInterval(smsTimer);
    smsTimer = setInterval(() => {
        smsCountdown--;
        if (smsCountdown <= 0) {
            clearInterval(smsTimer);
            btn.disabled = false;
            btn.textContent = '重新获取';
        } else {
            btn.textContent = smsCountdown + 's';
        }
    }, 1000);
}

function validateForm(e) {
    const code = document.getElementById('reg-sms-code').value.trim();
    if (code.length < 4) {
        alert('请输入短信验证码');
        e.preventDefault();
        return false;
    }
    const pwd = document.querySelector('[name="password"]').value;
    const confirmPwd = document.querySelector('[name="confirm_password"]').value;
    if (!/^[0-9a-zA-Z]+$/.test(pwd)) {
        alert('密码只能包含字母和数字');
        e.preventDefault();
        return false;
    }
    if (pwd !== confirmPwd) {
        alert('两次输入的密码不一致');
        e.preventDefault();
        return false;
    }
    return true;
}
</script>
{% endblock %}
