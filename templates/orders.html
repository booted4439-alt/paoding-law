{% extends "base.html" %}
{% block title %}账单记录 — 演算法律服务{% endblock %}
{% block body_class %}{% endblock %}
{% block nav_class %}nav-visible{% endblock %}
{% block main_class %}{% endblock %}
{% block footer_class %}{% endblock %}
{% block content %}
<div class="orders-page" style="max-width: 900px; margin: 0 auto; padding: 40px 24px;">
    <a href="/balance" class="btn btn-outline btn-sm" style="margin-bottom: 24px;">← 返回余额</a>
    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 24px;">账单记录</h1>

    <!-- Tab 切换 -->
    <div style="display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border-light);">
        <button class="tab-btn active" data-tab="all" onclick="switchTab(this, 'all')">全部</button>
        <button class="tab-btn" data-tab="recharge" onclick="switchTab(this, 'recharge')">充值记录</button>
        <button class="tab-btn" data-tab="consume" onclick="switchTab(this, 'consume')">消费记录</button>
    </div>

    <!-- 交易记录表格 -->
    <div id="orders-table" style="border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden;">
        <div style="text-align: center; padding: 48px; color: var(--text-muted);">加载中...</div>
    </div>
</div>

<script>
let currentTab = 'all';

function switchTab(el, type) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentTab = type;
    loadOrders();
}

function loadOrders() {
    const container = document.getElementById('orders-table');
    const type = currentTab === 'all' ? '' : currentTab === 'recharge' ? 'recharge' : 'consume';
    const url = type ? `/api/balance?type=${type}&page=1` : '/api/balance?type=&page=1';

    fetch(url)
        .then(r => r.json())
        .then(data => {
            if (data.transactions.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 48px; color: var(--text-muted);">暂无记录</div>';
                return;
            }
            let html = '<div class="admin-table"><table><thead><tr><th>类型</th><th>金额</th><th>余额</th><th>描述</th><th>时间</th></tr></thead><tbody>';
            const typeMap = {recharge: '充值', consume: '消费', refund: '退款', adjust: '调账'};
            data.transactions.forEach(tx => {
                const isIncome = tx.amount > 0;
                const color = isIncome ? 'var(--success)' : 'var(--danger)';
                html += `<tr>
                    <td><span style="background: ${isIncome ? '#e6f4ea' : '#fce8e6'}; color: ${color}; padding: 2px 10px; border-radius: 10px; font-size: 0.78rem;">${typeMap[tx.type] || tx.type}</span></td>
                    <td style="color: ${color}; font-weight: 500;">${isIncome ? '+' : ''}${(tx.amount / 100).toFixed(2)}</td>
                    <td>${(tx.balance_after / 100).toFixed(2)}</td>
                    <td>${tx.description || ''}</td>
                    <td style="color: var(--text-muted); font-size: 0.8rem;">${tx.created_at}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;

            if (data.pages > 1) {
                let pagination = '<div style="display: flex; justify-content: center; gap: 8px; padding: 16px;">';
                for (let i = 1; i <= data.pages; i++) {
                    pagination += `<button class="btn btn-sm ${i === data.current ? 'btn-primary' : 'btn-outline'}" onclick="loadPage(${i})">${i}</button>`;
                }
                pagination += '</div>';
                container.innerHTML += pagination;
            }
        })
        .catch(() => {
            container.innerHTML = '<div style="text-align: center; padding: 48px; color: var(--danger);">加载失败</div>';
        });
}

function loadPage(page) {
    const type = currentTab === 'all' ? '' : currentTab === 'recharge' ? 'recharge' : 'consume';
    const url = type ? `/api/balance?type=${type}&page=${page}` : `/api/balance?type=&page=${page}`;
    fetch(url)
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('orders-table');
            let html = '<div class="admin-table"><table><thead><tr><th>类型</th><th>金额</th><th>余额</th><th>描述</th><th>时间</th></tr></thead><tbody>';
            const typeMap = {recharge: '充值', consume: '消费', refund: '退款', adjust: '调账'};
            data.transactions.forEach(tx => {
                const isIncome = tx.amount > 0;
                const color = isIncome ? 'var(--success)' : 'var(--danger)';
                html += `<tr>
                    <td><span style="background: ${isIncome ? '#e6f4ea' : '#fce8e6'}; color: ${color}; padding: 2px 10px; border-radius: 10px; font-size: 0.78rem;">${typeMap[tx.type] || tx.type}</span></td>
                    <td style="color: ${color}; font-weight: 500;">${isIncome ? '+' : ''}${(tx.amount / 100).toFixed(2)}</td>
                    <td>${(tx.balance_after / 100).toFixed(2)}</td>
                    <td>${tx.description || ''}</td>
                    <td style="color: var(--text-muted); font-size: 0.8rem;">${tx.created_at}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        });
}

loadOrders();
</script>

<style>
.tab-btn {
    padding: 10px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 500;
}
</style>
{% endblock %}
