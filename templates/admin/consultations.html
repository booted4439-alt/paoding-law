{% extends "base.html" %}
{% block title %}咨询管理 — 演算法律服务{% endblock %}
{% block body_class %}admin-page{% endblock %}
{% block content %}
<div class="admin-layout">
    <nav class="admin-sidebar" id="admin-sidebar">
        <h3>管理后台</h3>
        <a href="/admin" class="admin-nav-link">概览</a>
        <a href="/admin/consultations" class="admin-nav-link active">咨询管理</a>
        <a href="/admin/users" class="admin-nav-link">用户管理</a>
        <a href="/admin/recharges" class="admin-nav-link">充值管理</a>
        <a href="/admin/prices" class="admin-nav-link">价格管理</a>
        <a href="/admin/invoices" class="admin-nav-link">发票管理</a>
        <a href="/admin/settings" class="admin-nav-link">网站设置</a>
    </nav>
    <div class="admin-main">
        <div class="admin-header">
            <div class="admin-header-left"><h2>咨询管理</h2></div>
            <div class="admin-header-right"><a href="/" class="top-home-link">演算首页</a><button class="sidebar-toggle admin-sidebar-toggle" onclick="toggleAdminSidebar()">☰</button></div>
        </div>
        <div class="admin-filters">
            <button class="filter-btn" onclick="adminLoadCons('', this)">全部</button>
            <button class="filter-btn active" onclick="adminLoadCons('pending', this)">待处理</button>
            <button class="filter-btn" onclick="adminLoadCons('active', this)">进行中</button>
            <button class="filter-btn" onclick="adminLoadCons('completed', this)">已完成</button>
        </div>
        <div class="admin-table" id="admin-cons-table"></div>
    </div>
</div>

<script>
function adminLoadCons(status, el) {
    if (!el) el = document.querySelector('.admin-filters .filter-btn[onclick*="'+status+'"]') || document.querySelector('.admin-filters .filter-btn');
    document.querySelectorAll('.admin-filters .filter-btn').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
    fetch('/admin/api/consultations?status=' + status)
        .then(r => r.json())
        .then(data => {
            const table = document.getElementById('admin-cons-table');
            table.innerHTML = '<table><thead><tr><th>ID</th><th>标题</th><th>用户</th><th>律师</th><th>状态</th><th>律师回复次数</th><th>剔除次数</th><th>消息数</th><th>时间</th><th>操作</th></tr></thead><tbody>' +
                data.consultations.map(function(c) {
                    return '<tr><td>' + c.id + '</td><td>' + escHtml(c.title) + '</td><td>' + escHtml(c.client) + '</td><td>' + (c.lawyer ? escHtml(c.lawyer) : '<span class=\"text-muted\">未分配</span>') + '</td><td><span class=\"status-badge status-' + c.status + '\">' + statusLabel(c.status) + '</span></td><td>' + (c.lawyer_reply_count ?? 0) + '</td><td>' + (c.excluded_count ?? 0) + '</td><td>' + c.message_count + '</td><td>' + c.created_at + '</td><td><a href=\"/admin/consultations/' + c.id + '\" class=\"btn btn-sm btn-outline\">查看</a> <button class=\"btn btn-sm btn-danger del-cons-btn\" data-id=\"' + c.id + '\">删除</button></td></tr>';
                }).join('') +
                '</tbody></table>';
            
            // 事件委托: 点击删除按钮
            document.querySelectorAll('.del-cons-btn').forEach(function(btn) {
                btn.onclick = function() {
                    var id = this.getAttribute('data-id');
                    if (!confirm('确定删除此咨询？相关消息也将一并删除。')) return;
                    fetch('/admin/api/consultations/' + id, { method: 'DELETE' })
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            if (data.ok) {
                                var activeBtn = document.querySelector('.admin-filters .filter-btn.active');
                                var s = activeBtn ? activeBtn.textContent.trim() : 'pending';
                                var statusMap = {'全部':'','待处理':'pending','进行中':'active','已完成':'completed'};
                                adminLoadCons(statusMap[s] || '');
                            } else {
                                alert(data.error || '删除失败');
                            }
                        });
                };
            });
        });
}
function escHtml(s) { var d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function statusLabel(s) { return {'pending':'待处理','active':'进行中','completed':'已完成','closed':'已关闭'}[s]||s; }
adminLoadCons('pending');
</script>
{% endblock %}
