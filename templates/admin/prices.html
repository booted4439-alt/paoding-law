{% extends "base.html" %}
{% block title %}价格管理 — 庖丁法律服务{% endblock %}
{% block body_class %}admin-page{% endblock %}
{% block content %}
<div class="admin-layout">
    <nav class="admin-sidebar" id="admin-sidebar">
        <h3>管理后台</h3>
        <a href="/admin" class="admin-nav-link">概览</a>
        <a href="/admin/consultations" class="admin-nav-link">咨询管理</a>
        <a href="/admin/documents" class="admin-nav-link">文档管理</a>
        <a href="/admin/users" class="admin-nav-link">用户管理</a>
        <a href="/admin/recharges" class="admin-nav-link">充值管理</a>
        <a href="/admin/prices" class="admin-nav-link active">价格管理</a>
        <a href="/admin/invoices" class="admin-nav-link">发票管理</a>
        <a href="/admin/settings" class="admin-nav-link">网站设置</a>
    </nav>
    <div class="admin-main">
        <div class="admin-header">
            <div class="admin-header-left"><h2>服务价格管理</h2></div>
            <div class="admin-header-right">
                <a href="/" class="top-home-link">庖丁首页</a>
                <button class="sidebar-toggle admin-sidebar-toggle" onclick="toggleAdminSidebar()">☰</button>
            </div>
        </div>

        <div style="margin: 16px 0;">
            <button class="btn btn-primary btn-sm" onclick="showPriceModal()">+ 新增服务</button>
        </div>

        <div id="prices-table" class="admin-table"></div>
    </div>
</div>

<!-- 服务价格 Modal -->
<div class="modal" id="price-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="price-modal-title">新增服务</h3>
            <button class="modal-close" onclick="closePriceModal()">&times;</button>
        </div>
        <form id="price-form">
            <input type="hidden" name="id" id="price-id">
            <div class="form-group">
                <label>服务名称 *</label>
                <input type="text" name="name" id="price-name" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>分类</label>
                    <select name="category" id="price-category">
                        <option value="consult">法律咨询</option>
                        <option value="contract">合同服务</option>
                        <option value="document">文书代写</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>价格（元）</label>
                    <input type="number" name="price" id="price-amount" step="0.01" min="0" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>排序</label>
                    <input type="number" name="sort_order" id="price-sort" value="0">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select name="is_active" id="price-active">
                        <option value="true">启用</option>
                        <option value="false">停用</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea name="description" id="price-desc" rows="2"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="closePriceModal()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<script>
let editPriceId = null;

function loadPrices() {
    fetch('/admin/api/prices')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('prices-table');
            if (data.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 48px; color: var(--text-muted);">暂无服务项，请新增</div>';
                return;
            }
            const catMap = {consult: '法律咨询', contract: '合同服务', document: '文书代写', other: '其他'};
            let html = '<table><thead><tr><th>排序</th><th>名称</th><th>分类</th><th>价格</th><th>描述</th><th>状态</th><th>操作</th></tr></thead><tbody>';
            data.forEach(p => {
                html += `<tr>
                    <td>${p.sort_order}</td>
                    <td><strong>${p.name}</strong></td>
                    <td>${catMap[p.category] || p.category}</td>
                    <td style="font-weight: 500; color: var(--primary);">${(p.price / 100).toFixed(2)} 元</td>
                    <td style="color: var(--text-secondary); font-size: 0.82rem;">${p.description || '-'}</td>
                    <td>${p.is_active ? '<span style="color: var(--success);">启用</span>' : '<span style="color: var(--text-muted);">停用</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick="editPrice(${p.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deletePrice(${p.id})">删除</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        });
}

function showPriceModal(data) {
    editPriceId = data ? data.id : null;
    document.getElementById('price-modal-title').textContent = data ? '编辑服务' : '新增服务';
    document.getElementById('price-id').value = data ? data.id : '';
    document.getElementById('price-name').value = data ? data.name : '';
    document.getElementById('price-category').value = data ? data.category : 'consult';
    document.getElementById('price-amount').value = data ? (data.price / 100).toFixed(2) : '';
    document.getElementById('price-sort').value = data ? data.sort_order : 0;
    document.getElementById('price-active').value = data ? (data.is_active ? 'true' : 'false') : 'true';
    document.getElementById('price-desc').value = data ? (data.description || '') : '';
    document.getElementById('price-modal').style.display = 'flex';
}

function closePriceModal() {
    document.getElementById('price-modal').style.display = 'none';
    editPriceId = null;
}

function editPrice(id) {
    fetch('/admin/api/prices')
        .then(r => r.json())
        .then(data => {
            const p = data.find(x => x.id === id);
            if (p) showPriceModal(p);
        });
}

function deletePrice(id) {
    if (!confirm('确认删除此服务项？')) return;
    fetch(`/admin/api/prices/${id}`, {method: 'DELETE'})
        .then(r => r.json())
        .then(d => { loadPrices(); });
}

document.getElementById('price-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(this));
    const payload = {
        name: data.name,
        category: data.category,
        price: parseFloat(data.price),
        sort_order: parseInt(data.sort_order || 0),
        is_active: data.is_active === 'true',
        description: data.description,
    };
    const id = data.id;
    const url = id ? `/admin/api/prices/${id}` : '/admin/api/prices';
    const method = id ? 'PUT' : 'POST';
    fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
        .then(r => r.json())
        .then(d => {
            closePriceModal();
            loadPrices();
        });
});

loadPrices();
</script>
{% endblock %}
