{% extends "base.html" %}
{% block title %}用户管理 — 庖丁法律服务{% endblock %}
{% block body_class %}admin-page{% endblock %}
{% block content %}
<div class="admin-layout">
    <nav class="admin-sidebar" id="admin-sidebar">
        <h3>管理后台</h3>
        <a href="/admin" class="admin-nav-link">概览</a>
        <a href="/admin/consultations" class="admin-nav-link">咨询管理</a>
        <a href="/admin/documents" class="admin-nav-link">文档管理</a>
        <a href="/admin/users" class="admin-nav-link active">用户管理</a>
        <a href="/admin/recharges" class="admin-nav-link">充值管理</a>
        <a href="/admin/prices" class="admin-nav-link">价格管理</a>
        <a href="/admin/invoices" class="admin-nav-link">发票管理</a>
        <a href="/admin/settings" class="admin-nav-link">网站设置</a>
    </nav>
    <div class="admin-main">
        <div class="admin-header">
            <div class="admin-header-left"><h2>用户管理</h2>
            <button class="btn btn-sm btn-outline" onclick="showUserForm()" style="color:var(--primary);border-color:var(--primary)">新建用户</button></div>
            <div class="admin-header-right"><a href="/" class="top-home-link">庖丁首页</a><button class="sidebar-toggle admin-sidebar-toggle" onclick="toggleAdminSidebar()">☰</button></div>
        </div>
        <div class="admin-table" id="admin-users-table"></div>
    </div>
</div>

<!-- User Form Modal -->
<div class="modal" id="user-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="user-form-title">新建用户</h3>
            <button class="modal-close" onclick="closeUserForm()">&times;</button>
        </div>
        <form onsubmit="return saveUser(event)">
            <input type="hidden" id="user-id">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="user-username" required>
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="user-email">
            </div>
            <div class="form-group">
                <label>密码 <span class="text-muted" id="pw-hint">(新建时必填)</span></label>
                <input type="password" id="user-password" minlength="6">
            </div>
            <div class="form-group">
                <label>手机 *</label>
                <input type="text" id="user-phone" maxlength="11" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><input type="checkbox" id="user-is_admin"> 管理员</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="user-is_lawyer"> 律师</label>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-outline" onclick="closeUserForm()">取消</button>
            </div>
        </form>
    </div>
</div>

<script>
function loadUsers() {
    fetch('/admin/api/users')
        .then(r => r.json())
        .then(users => {
            const table = document.getElementById('admin-users-table');
            table.innerHTML = `<table>
                <thead><tr><th>ID</th><th>用户名</th><th>邮箱</th><th>手机</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
                <tbody>
                    ${users.map(u => `<tr>
                        <td>${u.id}</td>
                        <td>${escHtml(u.username)}</td>
                        <td>${escHtml(u.email)}</td>
                        <td>${u.phone || '-'}</td>
                        <td>${roleBadge(u)}</td>
                        <td>${u.created_at}</td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="editUser(${u.id})">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id}, '${escHtml(u.username)}')">删除</button>
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
        });
}

function roleBadge(u) {
    let badges = [];
    if (u.is_admin) badges.push('<span class="badge badge-admin">管理员</span>');
    if (u.is_lawyer) badges.push('<span class="badge badge-lawyer">律师</span>');
    if (!badges.length) badges.push('<span class="badge badge-user">用户</span>');
    return badges.join(' ');
}

function showUserForm(data) {
    document.getElementById('user-form-title').textContent = data ? '编辑用户' : '新建用户';
    document.getElementById('user-id').value = data ? data.id : '';
    document.getElementById('user-username').value = data ? data.username : '';
    document.getElementById('user-email').value = data ? data.email : '';
    document.getElementById('user-password').value = '';
    document.getElementById('user-phone').value = data ? (data.phone || '') : '';
    document.getElementById('user-is_admin').checked = data ? data.is_admin : false;
    document.getElementById('user-is_lawyer').checked = data ? data.is_lawyer : false;
    document.getElementById('pw-hint').textContent = data ? '(留空不修改)' : '(新建时必填)';
    document.getElementById('user-password').required = !data;
    document.getElementById('user-modal').style.display = 'flex';
}

function closeUserForm() { document.getElementById('user-modal').style.display = 'none'; }

function editUser(id) {
    // Reuse users list data
    fetch('/admin/api/users')
        .then(r => r.json())
        .then(users => {
            const u = users.find(x => x.id === id);
            if (u) showUserForm(u);
        });
}

function saveUser(e) {
    e.preventDefault();
    const id = document.getElementById('user-id').value;
    const data = {
        username: document.getElementById('user-username').value.trim(),
        email: document.getElementById('user-email').value.trim(),
        phone: document.getElementById('user-phone').value.trim(),
        is_admin: document.getElementById('user-is_admin').checked,
        is_lawyer: document.getElementById('user-is_lawyer').checked,
    };
    const pw = document.getElementById('user-password').value;
    if (pw) data.password = pw;

    if (id) {
        fetch('/admin/api/users/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        }).then(r => r.json()).then(res => {
            if (res.ok) { closeUserForm(); loadUsers(); }
            else alert(res.error || '保存失败');
        });
    } else {
        data.password = pw;
        if (!data.password) { alert('请设置密码'); return; }
        fetch('/admin/api/users', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        }).then(r => r.json()).then(res => {
            if (res.id) { closeUserForm(); loadUsers(); }
            else alert(res.error || '创建失败');
        });
    }
    return false;
}

function deleteUser(id, username) {
    if (!confirm('确定删除用户 "' + username + '"？')) return;
    fetch('/admin/api/users/' + id, { method: 'DELETE' })
        .then(r => r.json())
        .then(res => {
            if (res.ok) loadUsers();
            else alert(res.error || '删除失败');
        });
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

// Add badge CSS dynamically
const style = document.createElement('style');
style.textContent = `
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; margin: 1px; }
.badge-admin { background: #cce5ff; color: #004085; }
.badge-lawyer { background: #d4edda; color: #155724; }
.badge-user { background: #e2e3e5; color: #383d41; }
`;
document.head.appendChild(style);

loadUsers();
</script>
{% endblock %}
