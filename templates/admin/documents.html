{% extends "base.html" %}
{% block title %}文档管理 — 庖丁法律服务{% endblock %}
{% block body_class %}admin-page{% endblock %}
{% block content %}
<div class="admin-layout">
    <nav class="admin-sidebar" id="admin-sidebar">
        <h3>管理后台</h3>
        <a href="/admin" class="admin-nav-link">概览</a>
        <a href="/admin/consultations" class="admin-nav-link">咨询管理</a>
        <a href="/admin/documents" class="admin-nav-link active">文档管理</a>
        <a href="/admin/users" class="admin-nav-link">用户管理</a>
        <a href="/admin/settings" class="admin-nav-link">网站设置</a>
    </nav>
    <div class="admin-main">
        <div class="admin-header">
            <div class="admin-header-left"><h2>法律文档管理</h2>
            <button class="btn btn-sm btn-outline" onclick="showDocForm()" style="color:var(--primary);border-color:var(--primary)">新建文档</button></div>
            <div class="admin-header-right"><a href="/" class="top-home-link">庖丁首页</a><button class="sidebar-toggle admin-sidebar-toggle" onclick="toggleAdminSidebar()">☰</button></div>
        </div>
        <div class="admin-table" id="admin-docs-table"></div>
    </div>
</div>

<!-- Doc Editor Modal -->
<div class="modal" id="doc-modal">
    <div class="modal-content modal-lg">
        <div class="modal-header">
            <h3 id="doc-form-title">新建文档</h3>
            <button class="modal-close" onclick="closeDocForm()">&times;</button>
        </div>
        <form onsubmit="return saveDoc(event)">
            <input type="hidden" id="doc-id">
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="doc-title" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" id="doc-category" placeholder="例如: 合同法、劳动法...">
                </div>
                <div class="form-group">
                    <label>发布</label>
                    <select id="doc-published">
                        <option value="1">已发布</option>
                        <option value="0">草稿</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>摘要</label>
                <input type="text" id="doc-summary" placeholder="简短描述文档内容">
            </div>
            <div class="form-group">
                <label>内容 (支持 Markdown 格式)</label>
                <textarea id="doc-content" rows="16" required></textarea>
            </div>
            <div class="form-group">
                <label>预览</label>
                <div id="doc-preview" class="doc-preview"></div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <button type="button" class="btn btn-outline" onclick="closeDocForm()">取消</button>
            </div>
        </form>
    </div>
</div>

<script>
function loadDocs() {
    fetch('/admin/api/documents')
        .then(r => r.json())
        .then(docs => {
            const table = document.getElementById('admin-docs-table');
            table.innerHTML = `<table>
                <thead><tr><th>ID</th><th>标题</th><th>分类</th><th>状态</th><th>更新</th><th>操作</th></tr></thead>
                <tbody>
                    ${docs.map(d => `<tr>
                        <td>${d.id}</td>
                        <td>${escHtml(d.title)}</td>
                        <td>${escHtml(d.category)}</td>
                        <td>${d.is_published ? '✅ 已发布' : '📝 草稿'}</td>
                        <td>${d.updated_at}</td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="editDoc(${d.id})">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteDoc(${d.id})">删除</button>
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
        });
}

function showDocForm(data) {
    document.getElementById('doc-form-title').textContent = data ? '编辑文档' : '新建文档';
    document.getElementById('doc-id').value = data ? data.id : '';
    document.getElementById('doc-title').value = data ? data.title : '';
    document.getElementById('doc-category').value = data ? data.category : '';
    document.getElementById('doc-published').value = data && !data.is_published ? '0' : '1';
    document.getElementById('doc-summary').value = data ? (data.summary || '') : '';
    document.getElementById('doc-content').value = data ? data.content : '';
    document.getElementById('doc-modal').style.display = 'flex';
    setTimeout(updatePreview, 100);
}

function closeDocForm() { document.getElementById('doc-modal').style.display = 'none'; }

function editDoc(id) {
    fetch('/admin/api/documents/' + id)
        .then(r => r.json())
        .then(d => showDocForm(d));
}

function saveDoc(e) {
    e.preventDefault();
    const id = document.getElementById('doc-id').value;
    const data = {
        title: document.getElementById('doc-title').value.trim(),
        category: document.getElementById('doc-category').value.trim() || 'general',
        content: document.getElementById('doc-content').value,
        summary: document.getElementById('doc-summary').value.trim(),
        is_published: document.getElementById('doc-published').value === '1',
    };
    if (id) {
        fetch('/admin/api/documents/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        }).then(r => r.json()).then(() => { closeDocForm(); loadDocs(); });
    } else {
        fetch('/admin/api/documents', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        }).then(r => r.json()).then(() => { closeDocForm(); loadDocs(); });
    }
    return false;
}

function deleteDoc(id) {
    if (!confirm('确定删除此文档？')) return;
    fetch('/admin/api/documents/' + id, { method: 'DELETE' })
        .then(() => loadDocs());
}

function renderContent(content) {
    if (!content) return '';
    let html = content
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Convert markdown tables to HTML tables
    html = html.replace(/(^\|.+\|[\s\S]*?)(?=\n{2,}|$)/gm, function(block) {
        var lines = block.trim().split('\n');
        if (lines.length < 2) return block;
        if (!/^\|\s*[-:]/.test(lines[1].trim())) return block;
        var headers = lines[0].split('|').filter(function(c){return c.trim();});
        if (!headers.length) return block;
        var thead = '<thead><tr>' + headers.map(function(h){return '<th>'+h.trim()+'</th>';}).join('') + '</tr></thead>';
        var tbody = '';
        for (var i=2;i<lines.length;i++){
            var cells = lines[i].split('|').filter(function(c){return c.trim();});
            if (!cells.length) continue;
            tbody += '<tr>' + cells.map(function(c){return '<td>'+c.trim()+'</td>';}).join('') + '</tr>';
        }
        if (!tbody) return block;
        return '<div class="table-wrap"><table>' + thead + tbody + '</table></div>';
    });
    html = html
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
}

function updatePreview() {
    const content = document.getElementById('doc-content').value;
    const preview = document.getElementById('doc-preview');
    preview.innerHTML = renderContent(content);
}
document.getElementById('doc-content').addEventListener('input', updatePreview);

function escHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
loadDocs();
</script>
{% endblock %}
