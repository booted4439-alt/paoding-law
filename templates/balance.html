{% extends "base.html" %}
{% block title %}我的余额 — 庖丁法律服务{% endblock %}
{% block body_class %}{% endblock %}
{% block nav_class %}nav-visible{% endblock %}
{% block footer_class %}{% endblock %}
{% block content %}
<div class="balance-page" style="max-width: 800px; margin: 0 auto; padding: 40px 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
        <h1 style="font-size: 1.5rem; font-weight: 700;">我的余额</h1>
        <div style="display: flex; gap: 8px;">
            <a href="/balance/orders" class="btn btn-outline btn-sm">账单记录</a>
            <a href="/balance/invoice" class="btn btn-outline btn-sm">发票管理</a>
        </div>
    </div>

    <!-- 余额卡片 -->
    <div style="background: linear-gradient(135deg, var(--primary), #1557b0); border-radius: var(--radius); padding: 32px; color: #fff; margin-bottom: 32px;">
        <div style="font-size: 0.9rem; opacity: 0.85; margin-bottom: 8px;">当前余额</div>
        <div style="font-size: 2.8rem; font-weight: 700; margin-bottom: 20px;">
            <span id="balance-amount">-</span>
            <span style="font-size: 1rem; opacity: 0.85;"> 元</span>
        </div>
        <a href="/balance/top_up" class="btn" style="background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3);">充值</a>
    </div>

    <!-- 快捷充值 -->
    <div style="margin-bottom: 32px;">
        <h2 style="font-size: 1rem; font-weight: 600; margin-bottom: 12px;">快捷充值</h2>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
            <button class="btn btn-outline quick-amount" data-amount="50" onclick="quickTopUp(this)">50 元</button>
            <button class="btn btn-outline quick-amount" data-amount="100" onclick="quickTopUp(this)">100 元</button>
            <button class="btn btn-outline quick-amount" data-amount="200" onclick="quickTopUp(this)">200 元</button>
            <button class="btn btn-outline quick-amount" data-amount="500" onclick="quickTopUp(this)">500 元</button>
        </div>
    </div>

    <!-- 最近交易 -->
    <div>
        <h2 style="font-size: 1rem; font-weight: 600; margin-bottom: 12px;">最近交易</h2>
        <div id="recent-transactions" style="border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden;">
            <div style="text-align: center; padding: 32px; color: var(--text-muted);">加载中...</div>
        </div>
    </div>
</div>

<script>
function loadBalance() {
    fetch('/api/balance?type=&page=1')
        .then(r => r.json())
        .then(data => {
            document.getElementById('balance-amount').textContent = (data.balance / 100).toFixed(2);
            const container = document.getElementById('recent-transactions');
            if (data.transactions.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 32px; color: var(--text-muted);">暂无交易记录</div>';
                return;
            }
            let html = '<div class="admin-table"><table><thead><tr><th>类型</th><th>金额</th><th>描述</th><th>时间</th></tr></thead><tbody>';
            data.transactions.slice(0, 10).forEach(tx => {
                const typeMap = {recharge: '充值', consume: '消费', refund: '退款', adjust: '调账'};
                const isIncome = tx.amount > 0;
                html += `<tr>
                    <td>${typeMap[tx.type] || tx.type}</td>
                    <td style="color: ${isIncome ? 'var(--success)' : 'var(--danger)'}; font-weight: 500;">${isIncome ? '+' : ''}${(tx.amount / 100).toFixed(2)}</td>
                    <td>${tx.description || ''}</td>
                    <td style="color: var(--text-muted); font-size: 0.8rem;">${tx.created_at}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        })
        .catch(() => {
            document.getElementById('recent-transactions').innerHTML = '<div style="text-align: center; padding: 32px; color: var(--danger);">加载失败</div>';
        });
}
loadBalance();

function quickTopUp(btn) {
    const amount = btn.dataset.amount;
    window.location.href = '/balance/top_up?amount=' + amount;
}
</script>

<style>
.quick-amount:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
}
@media (max-width: 600px) {
    .balance-page { padding: 24px 16px; }
    [style*="grid-template-columns: repeat(4, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
    }
}
</style>
{% endblock %}
