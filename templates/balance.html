{% extends "base.html" %}
{% block title %}我的余额 — 庖丁法律服务{% endblock %}
{% block body_class %}{% endblock %}
{% block nav_class %}nav-visible{% endblock %}
{% block main_class %}{% endblock %}
{% block footer_class %}{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 40px 16px;">
    <div style="text-align: center;">
        <div style="font-size: 0.9rem; color: #888; margin-bottom: 8px;">当前余额</div>
        <div style="font-size: 2.5rem; font-weight: 700; color: #333; margin-bottom: 24px;">
            <span id="balance-amount">-</span>
            <span style="font-size: 0.9rem; color: #888;"> 元</span>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 32px;">
            <a href="/balance/top_up" class="btn btn-primary">充值</a>
            <a href="/balance/orders" class="btn btn-outline">账单</a>
            <a href="/balance/invoice" class="btn btn-outline">发票</a>
        </div>
    </div>

    <div style="border: 1px solid #eee; border-radius: 8px; overflow: hidden;">
        <div id="recent-transactions" style="text-align: center; padding: 24px; color: #999; font-size: 0.85rem;">加载中...</div>
    </div>
</div>

<script>
fetch('/api/balance?type=&page=1')
    .then(r => r.json())
    .then(data => {
        document.getElementById('balance-amount').textContent = (data.balance / 100).toFixed(2);
        const container = document.getElementById('recent-transactions');
        if (!data.transactions || data.transactions.length === 0) {
            container.innerHTML = '<div style="padding: 24px; color: #999; font-size: 0.85rem;">暂无交易记录</div>';
            return;
        }
        let html = '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;">';
        html += '<thead><tr style="border-bottom:1px solid #eee;"><th style="padding:10px 14px;text-align:left;font-weight:500;color:#888;">类型</th><th style="padding:10px 14px;text-align:right;font-weight:500;color:#888;">金额</th><th style="padding:10px 14px;text-align:right;font-weight:500;color:#888;">时间</th></tr></thead><tbody>';
        data.transactions.slice(0, 10).forEach(tx => {
            const typeMap = {recharge:'充值',consume:'消费',refund:'退款',adjust:'调账'};
                        const amt = tx.amount / 100;
            const prefix = amt > 0 ? "+" : (amt < 0 ? "-" : "");
            const color = amt >= 0 ? "#4caf50" : "#e44";
            html += '<tr style="border-bottom:1px solid #f5f5f5;"><td style="padding:10px 14px;">'+ (typeMap[tx.type]||tx.type) +'</td><td style="padding:10px 14px;text-align:right;color:'+color+';">'+ prefix + Math.abs(amt).toFixed(2) +'</td><td style="padding:10px 14px;text-align:right;color:#bbb;">'+ (tx.created_at||'').substring(0,10) +'</td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    })
    .catch(() => {
        document.getElementById('recent-transactions').innerHTML = '<div style="padding:24px;color:#e44;font-size:0.85rem;">加载失败</div>';
    });
</script>
{% endblock %}
